[project]
license = "Apache-2.0"
name = "qxp-asr"
version = "0.1.0"
description = "Puno Quechua (qxp) ASR system for the SIMBig 2026 shared task (Task 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "jiwer>=3.0",
    "lets-plot>=4.5",
    "polars>=1.10",
    "pyarrow>=17",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["ruff>=0.7", "pytest>=8", "pre-commit>=4", "ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qxp_asr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL", "RUF", "NPY", "PERF"]
ignore = ["PLR0913", "PLR2004", "PLR0915", "PLR0912", "PLR0917"]
# Quechua text legitimately contains apostrophe look-alikes (ejective markers).
allowed-confusables = ["’", "‘", "ʼ", "ʻ", "´", "′"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts lazily import heavy, environment-specific modules.
"scripts/*" = ["PLC0415"]
# Manim talk-video scenes: long chained animation calls, typographic characters (·, −, ×) in
# on-screen text, and geometry names in capitals are intentional there.
"docs/video/*.py" = ["E501", "RUF001", "RUF005", "N802", "N806", "E741", "C408", "C416",
  "PTH123", "SIM115", "RET504", "F841"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
